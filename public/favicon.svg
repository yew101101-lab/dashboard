<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- 오로라 그라디언트 백그라운드 -->
    <linearGradient id="aurora" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#32b3ed" />
      <stop offset="50%" stop-color="#f83ca0" />
      <stop offset="100%" stop-color="#ffeb0b" />
    </linearGradient>
    
    <!-- 앞면 반사광 그라디언트 -->
    <linearGradient id="glass-reflect" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    
    <!-- 입사광 테두리 그라디언트 -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- 뒤쪽 발광 오로라 구체 -->
  <circle cx="16" cy="16" r="14" fill="url(#aurora)" filter="blur(1px)" />

  <!-- 글래스모피즘 유리판 효과 -->
  <rect x="5" y="5" width="22" height="22" rx="7" fill="rgba(255, 255, 255, 0.12)" />
  
  <!-- 유리판 위의 하이라이트 반사광 -->
  <rect x="5" y="5" width="22" height="22" rx="7" fill="url(#glass-reflect)" />

  <!-- 얇고 정교한 하얀 입사광 테두리 -->
  <rect x="5" y="5" width="22" height="22" rx="7" fill="none" stroke="url(#border-grad)" stroke-width="1.2" />

  <!-- 대시보드 스파클 엠블럼 -->
  <path d="M16 11l1.5 3.5L21 16l-3.5 1.5L16 21l-1.5-3.5L11 16l3.5-1.5z" fill="#ffffff" opacity="0.9" />
</svg>